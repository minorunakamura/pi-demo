<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>リバーシ — 黒の初手</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'/%3E" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">REVERSI · 黒の初手まで</p>
        <h1>リバーシ</h1>
        <p>あなたは黒・先手です。合法手を選んで石を返してみましょう。</p>
        <p class="notice">CPUは未接続です。黒の初手の後、白の手番で停止します。</p>
      </header>
      <section class="game" aria-label="対局">
        <div class="summary">
          <div role="status" aria-live="polite" aria-atomic="true">
            <p id="turn" class="turn"></p>
            <p id="score" class="score"></p>
            <p id="last-move"></p>
            <p id="pass"></p>
          </div>
          <button id="reset" type="button">最初から</button>
        </div>
        <div id="board" class="board" role="group" aria-label="リバーシ盤面、左上A1" aria-describedby="board-help"></div>
        <p id="board-help" class="help">＋：黒の合法手 ／ ★と枠：直前の着手<br />Tabでマスを移動し、Enter / Spaceで着手できます。白の手番では着手できません。</p>
      </section>
    </main>
  </body>
</html>
